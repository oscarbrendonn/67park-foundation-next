name: Short checks and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full browser suite and 15-minute mobile soak before publishing
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: feel-lab-pages
  cancel-in-progress: true
jobs:
  regression:
    name: Short checks (full browser suite is opt-in)
    runs-on: ubuntu-24.04
    # Temporarily opt-in at the user's request. Restore automatic full coverage
    # by setting the repository variable PARK_FULL_REGRESSION to true.
    env:
      RUN_FULL_BROWSER_TESTS: ${{ vars.PARK_FULL_REGRESSION == 'true' || inputs.full_regression == true }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Install browser only for the full suite
        if: env.RUN_FULL_BROWSER_TESTS == 'true'
        run: npx playwright install --with-deps chromium
      - name: Install CPU OpenGL test renderer
        if: env.RUN_FULL_BROWSER_TESTS == 'true'
        run: sudo apt-get install -y libgl1-mesa-dri libegl-mesa0 libglx-mesa0 mesa-utils xvfb
      - run: npm test
      - name: Release profile and changed-feature unit checks
        run: node --import ./qa/register-three.mjs --test qa/release-profile.test.mjs qa/running-camera-punch.test.mjs qa/camera-touch-zoom.test.mjs qa/playable-character.test.mjs qa/studio-catalog.test.mjs
      - name: Chat spam, safety, reconnect, 100 home transitions, asset retry and mobile soak
        if: env.RUN_FULL_BROWSER_TESTS == 'true'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:browser
        env:
          PARK_SOAK_MS: '900000'
          PARK_SOFTWARE_RENDER: '1'
          PARK_SOFTWARE_DRIVER: 'mesa'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: 'llvmpipe'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: .qa-results/
          include-hidden-files: true
      - name: Stage only public game files
        run: rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' --exclude='server/' --exclude='qa/' --exclude='data/' --exclude='.qa-results/' --exclude='.pages-stage/' --exclude='package*.json' ./ .pages-stage/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-stage
  deploy:
    needs: regression
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish after selected checks pass
        id: publish
        uses: actions/deploy-pages@v4
